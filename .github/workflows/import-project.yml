name: Importar proyecto MED3D
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-project.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: med3d-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Importar el paquete validado
        if: ${{ hashFiles('package.json') == '' }}
        env:
          SOURCE_ARCHIVE_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3J84KV9o8lMMvHP1KXRyPnbgsve/b4f195bb-dd45-4384-a11b-10b785024ddb.zip
          SOURCE_ARCHIVE_SHA256: a5ecb31789264c9a872b3790b92036fa2199e966ad03c0ebcf45784d528bfb12
          SOURCE_PATCH_SHA256: 583ada311361bf5674270c4aabe0ae83f1dfd7eb9e6380681d4b36f604d9d870
        run: |
          curl --fail --location --retry 3 "$SOURCE_ARCHIVE_URL" --output "$RUNNER_TEMP/med3d-import.zip"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, zipfile
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'med3d-import.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['SOURCE_ARCHIVE_SHA256'], 'Archive checksum mismatch'
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  p = pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts, 'Invalid archive path'
                  assert p.parts and p.parts[0] not in {'.git', '.github', 'node_modules', 'dist'}, 'Unexpected archive entry'
              z.extractall('.')
          payload = pathlib.Path('.github/med3d-import-patch.b64').read_bytes()
          assert hashlib.sha256(payload).hexdigest() == os.environ['SOURCE_PATCH_SHA256'], 'Patch checksum mismatch'
          patch = json.loads(gzip.decompress(base64.b64decode(payload, validate=True)))
          def safe_path(name):
              p = pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts, 'Invalid patch path'
              assert p.parts and p.parts[0] not in {'.git', '.github', 'node_modules', 'dist'}, 'Unexpected patch entry'
              return p
          for name in patch['removed']:
              safe_path(name).unlink(missing_ok=True)
          for name, content in patch['files'].items():
              p = safe_path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')
          assert pathlib.Path('package-lock.json').is_file(), 'Missing dependency lockfile'
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Guardar el proyecto en el repositorio
        run: |
          git add -A -- . ':!.github'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import MED3D source and optimized 3D models"
            git push origin HEAD:main
          fi
          git rev-parse --verify HEAD
